[package]
edition = "2024"
name = "esp-bimo"
rust-version = "1.95"
version = "0.1.0"
default-run = "esp-bimo"

[[bin]]
name = "esp-bimo"
path = "./src/bin/main.rs"

[features]
default = []
motor-test = []
motor-pwm-diagnostic = []
motor-duty-characterization = []
motor-continuation-characterization = []
motor-kick-diagnostic = []
motor-kick-live = ["motor-kick-diagnostic"]
orientation-diagnostic = []
balance-test = []
balance-live = ["balance-test"]
balance-motor-response-test = ["balance-test"]
balance-motor-response-live = ["balance-motor-response-test"]
balance-ground-contact-test = ["balance-test"]
balance-ground-contact-live = ["balance-ground-contact-test"]

balance-bidirectional-ground-test = ["balance-test"]
balance-bidirectional-ground-live = ["balance-bidirectional-ground-test"]

balance-control-test = ["balance-test"]
balance-control-live = ["balance-control-test"]
balance-control-restart-assist = ["balance-control-test"]
balance-control-rolling-assist = ["balance-control-test"]
balance-control-recovery-assist = ["balance-control-rolling-assist"]
balance-control-short-recovery-zero = ["balance-control-recovery-assist"]

[[bin]]
name = "balance-control-test"
path = "src/bin/balance_control_test.rs"
required-features = ["balance-control-test"]

[[bin]]
name = "balance-bidirectional-ground-test"
path = "src/bin/balance_bidirectional_ground_test.rs"
required-features = ["balance-bidirectional-ground-test"]

[[bin]]
name = "motor-test"
path = "src/bin/motor_test.rs"
required-features = ["motor-test"]

[[bin]]
name = "motor-pwm-test"
path = "src/bin/motor_pwm_test.rs"
required-features = ["motor-test"]

[[bin]]
name = "motor-pwm-diagnostic"
path = "src/bin/motor_pwm_diagnostic.rs"
required-features = ["motor-pwm-diagnostic"]

[[bin]]
name = "motor-kick-diagnostic"
path = "src/bin/motor_kick_diagnostic.rs"
required-features = ["motor-kick-diagnostic"]

[[bin]]
name = "orientation-diagnostic"
path = "src/bin/orientation_diagnostic.rs"
required-features = ["orientation-diagnostic"]

[[bin]]
name = "balance-test"
path = "src/bin/balance_test.rs"
required-features = ["balance-test"]

[[bin]]
name = "balance-motor-response-test"
path = "src/bin/balance_motor_response_test.rs"
required-features = ["balance-motor-response-test"]

[[bin]]
name = "balance-ground-contact-test"
path = "src/bin/balance_ground_contact_test.rs"
required-features = ["balance-ground-contact-test"]

[dependencies]
libm = "=0.2.16"
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
    "embassy",
    "esp-alloc",
    "esp32s3",
    "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial", "critical-section"] }

critical-section = "1.2.0"
static_cell = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = 2     # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'

[[bin]]
name = "motor-duty-characterization"
path = "src/bin/motor_duty_characterization.rs"
required-features = ["motor-duty-characterization"]

[[bin]]
name = "motor-continuation-characterization"
path = "src/bin/motor_continuation_characterization.rs"
required-features = ["motor-continuation-characterization"]

[[bin]]
name = "hardware_diagnostics"
path = "src/bin/hardware_diagnostics.rs"
